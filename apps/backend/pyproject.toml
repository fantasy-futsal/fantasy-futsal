[project]
name = "fantasy-futsal-backend"
version = "0.0.1"
description = "Fantasy Futsal FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
