name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        # v6 reads the pnpm version from the devEngines.packageManager field in
        # package.json; v4 only honored the corepack `packageManager` field,
        # which we don't set.
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up uv
        # No python-version input needed: `uv sync` resolves the interpreter
        # from .python-version / requires-python and fetches it if missing.
        uses: astral-sh/setup-uv@v6

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (TypeScript)
        run: pnpm -r --parallel lint

      - name: Type-check (TypeScript)
        run: pnpm -r --parallel check

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Lint (Python)
        run: uv run ruff check .

      - name: Type-check (Python)
        run: uv run mypy .
