pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,json}'
      run: pnpm exec eslint --fix {staged_files}
    format:
      glob: '*.{js,ts,json,md}'
      run: pnpm exec prettier --write {staged_files}

commit-msg:
  parallel: false
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {msg_file}
