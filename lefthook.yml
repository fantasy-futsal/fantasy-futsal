pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,svelte,json}'
      run: pnpm exec eslint --fix {staged_files}
    format:
      glob: '*.{js,ts,svelte,json,md,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}

commit-msg:
  parallel: false
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {msg_file}
